[package]
name = "tunstile_protocol"
version = "0.0.1"
edition = "2024"
description = "A Rust implementation of the Wireguard protocol"
license = "MIT"
repository = "https://github.com/n8mgr/tunstile"
keywords = ["wireguard", "vpn", "tunnel", "networking", "no_std"]

[dependencies]
base64 = { version = "0.22.1", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
hmac = { version = "0.12.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tai64 = { version = "4.1.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "static_secrets", "reusable_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
rand = "0.10.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "reusable_secrets", "getrandom"] }
base64 = "0.22.1"

[features]
default = []
std = ["base64/std", "thiserror/std", "x25519-dalek/getrandom", "tai64/std", "subtle/std", "blake2/std", "hmac/std"]

[[bench]]
name = "handshake"
harness = false

[[bench]]
name = "transport"
harness = false
