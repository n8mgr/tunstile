[package]
name = "spacetun-device"
version = "0.0.1"
edition = "2024"
description = "A pure Rust implementation of the Wireguard protocol"
license = "MIT"
repository = "https://github.com/n8mgr/spacetun"
keywords = ["wireguard", "vpn", "tunnel", "networking"]

[dependencies]
etherparse = "0.19.0"
hex = "0.4.3"
spacetun-protocol = { path = "../protocol", features = ["std"] }
