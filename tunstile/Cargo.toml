[package]
name = "tunstile"
version = "0.0.1"
edition = "2024"
description = "End-to-end WireGuard tunnel: a TUN interface with cryptokey routing over tunstile_tunnel"
license = "MIT"
repository = "https://github.com/n8mgr/tunstile"
keywords = ["wireguard", "vpn", "tunnel", "tun", "networking"]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
ipnet = "2.12.0"
log = "0.4.33"
tunstile_tunnel = { version = "0.0.1", path = "../tunnel" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["net", "rt", "rt-multi-thread", "sync", "macros", "signal"] }
tun = { version = "0.8.13", features = ["async"] }

[[bin]]
name = "tunstile"
path = "src/bin/tunstile.rs"
